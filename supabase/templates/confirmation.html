<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#F1F5FA;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F1F5FA;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="background:#2C7BD1;padding:20px 32px;">
                <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:0.3px;font-family:Arial,Helvetica,sans-serif;">Nexus</span>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 8px;">
                <h1 style="margin:0 0 12px;font-size:20px;color:#101828;font-family:Arial,Helvetica,sans-serif;">Confirma tu correo</h1>
                <div style="font-size:15px;line-height:1.6;color:#5B6472;font-family:Arial,Helvetica,sans-serif;">
                  Falta un paso para activar tu cuenta en Nexus. Confirma tu correo para empezar a organizar tus proyectos.
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 8px;">
                <a href="{{ .ConfirmationURL }}" style="background:#2C7BD1;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 28px;border-radius:999px;display:inline-block;font-family:Arial,Helvetica,sans-serif;font-size:15px;">Confirmar mi correo</a>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 24px;">
                <span style="font-size:12px;color:#94A3B8;font-family:Arial,Helvetica,sans-serif;">Si el botón no funciona, copia y pega este link en tu navegador:<br/>{{ .ConfirmationURL }}</span>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #EEF2F7;">
                <span style="font-size:12px;color:#94A3B8;font-family:Arial,Helvetica,sans-serif;">Nexus · gestión de proyectos con IA local</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
